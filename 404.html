<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redirecting…</title>
  <style>
    body { margin: 0; background: #1a0a40; display: flex; align-items: center; justify-content: center; height: 100vh; }
    .spinner { width: 32px; height: 32px; border-radius: 50%; border: 3px solid rgba(255,255,255,0.15); border-top-color: #fff; animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <script>
    (function () {
      var path = window.location.pathname;

      // Match /AUTh_Library_Web/<TABLE> — e.g. /AUTh_Library_Web/C4
      var match = path.match(/\/AUTh_Library_Web\/([A-Fa-f]\d{1,2})$/);
      if (match) {
        var table = match[1].toUpperCase();
        window.location.replace('/AUTh_Library_Web/map.html?table=' + table);
        return;
      }

      // Anything else → homepage
      window.location.replace('/');
    })();
  </script>
</body>
</html>
