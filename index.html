<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AUTh Library App</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #6323ca; /* Matches your app's theme */
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
        }
        .container {
            background-color: rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 16px;
            max-width: 400px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }
        h1 {
            margin-top: 0;
            font-size: 24px;
        }
        p {
            font-size: 16px;
            line-height: 1.5;
            margin-bottom: 30px;
        }
        .play-button {
            display: inline-block;
            background-color: #ffffff;
            color: #6323ca;
            text-decoration: none;
            font-weight: bold;
            padding: 15px 30px;
            border-radius: 30px;
            font-size: 16px;
            transition: transform 0.2s, background-color 0.2s;
        }
        .play-button:hover {
            transform: scale(1.05);
            background-color: #f0f0f0;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>AUTh Central Library</h1>
        <p>You were invited to join a table! To see exactly where your friends are sitting, download the official app.</p>
        
        <!-- Replace the '#' with your actual Google Play Store URL once published -->
        <a href="#" class="play-button">Get it on Google Play</a>
    </div>

</body>
</html>
